; Configurações do agente Vídeo Vendas. Edite com o Bloco de Notas.

[pastas]
produtos = produtos
saida = saida
musicas = musicas

[video]
; segundos de cada foto/clipe (3 a 5 mídias x 5 s = 15 a 25 s)
segundos_por_midia = 5
; volume da música (0.25 = baixo)
volume_musica = 0.25
; fonte para o texto na tela (deixe assim no Windows)
fonte = C:\Windows\Fonts\arial.ttf

[texto]
; sim = usa a IA do Claude; nao = usa um texto simples fixo
usar_ia = sim
; chave: variável ANTHROPIC_API_KEY ou arquivo chave_anthropic.txt (nesta pasta)
modelo = claude-haiku-4-5-20251001

[notificacao]
; TROQUE por um nome secreto e difícil de adivinhar (ex.: bruno-videos-7x92kq)
; No celular: instale o app "ntfy" e assine este mesmo nome.
ntfy_topico = TROQUE-POR-UM-NOME-SECRETO

[shopee]
; Palavras de busca (separadas por vírgula). Casa e festa:
palavras = decoração festa, kit festa aniversário, balões, descartáveis festa, organizador casa, utensílios cozinha, decoração casa
limite_por_palavra = 20
; quantos produtos novos preparar por execução
quantos = 5
; filtros (comissão 0.05 = 5%)
preco_min = 15
preco_max = 200
comissao_min = 0.05
nota_min = 4.5
vendas_min = 100
